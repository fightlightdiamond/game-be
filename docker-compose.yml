version: "3.8"

networks:
  betn:
    driver: overlay

services:
  mysql:
    image: "mysql:latest"
    hostname: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=hero
      - MYSQL_DATABASE=bet_herox
      - MYSQL_USER=siteuser
      - MYSQL_PASSWORD=sitepass
    ports:
      - '33068:3306'
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - betn

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1027:1025
      - 8027:8025
    deploy:
      replicas: 1
    networks:
      - betn

  redis:
    image: 'redis:latest'
    ports:
      - '63791:6379'
    deploy:
      replicas: 1
    networks:
      - betn

  zookeeper:
    image: 'bitnami/zookeeper:3.6.2'
    ports:
      - 2181:2181
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    deploy:
      replicas: 1
    networks:
      - betn
    volumes:
      - ./.docker/zookeeper:/var/lib/zookeeper

  kafka:
    image: 'bitnami/kafka:2.6.0'
    ports:
      - 9093:9093
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=10485760
      - KAFKA_CFG_MESSAGE_MAX_BYTES=10485760
    deploy:
      replicas: 1
    networks:
      - betn
    depends_on:
      - zookeeper
    volumes:
      - ./.docker/kafka:/bitnami/kafka

  kafdrop:
    image: obsidiandynamics/kafdrop
    ports:
      - '9000:9000'
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms160M -Xmx480M -Xss1800K -XX:-TieredCompilation -XX:+UseStringDeduplication -noverify
    deploy:
      replicas: 1
    networks:
      - betn
    depends_on:
      - kafka